
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بهی مسنجر</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>
    [hidden] {
      display: none !important;
    }

    /* فقط یک منوی اصلی */
    .sidebar-tabs {
      display: none !important;
    }

    .mobile-nav {
      display: none !important;
    }

    @media (max-width: 700px) {
      .mobile-nav {
        display: flex !important;
      }
    }
  </style>
</head>

<body>

  <!-- ورود و ثبت نام -->
  <section id="auth-section">
    <div class="auth-card">
      <div class="welcome-logo">B</div>
      <h1>بهی مسنجر</h1>
      <p>پیام‌رسان ساده، سریع و امن</p>

      <div class="auth-tabs">
        <button id="login-tab" type="button">ورود</button>
        <button id="signup-tab" type="button">ساخت حساب</button>
      </div>

      <form id="auth-form">
        <label for="username">نام کاربری</label>
        <input
          id="username"
          type="text"
          placeholder="نام کاربری"
          autocomplete="username"
          required
        >

        <label for="password">رمز عبور</label>
        <input
          id="password"
          type="password"
          placeholder="رمز عبور"
          autocomplete="current-password"
          required
        >

        <button id="auth-submit" class="primary" type="submit">
          ورود به حساب
        </button>

        <div id="auth-message"></div>
      </form>
    </div>
  </section>

  <!-- برنامه -->
  <section id="chat-section" hidden>

    <span id="current-user" hidden></span>

    <div id="chat-layout" class="chat-layout">

      <!-- فهرست گفتگوها -->
      <aside class="sidebar">

        <header class="sidebar-header">
          <h2 id="list-heading">گفتگوها</h2>

          <button
            id="new-chat-btn"
            class="round-button"
            type="button"
            title="جستجوی کاربران"
          >
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </header>

        <!-- جستجوی کاربران -->
        <div class="search-box" style="display:none">
          <input
            id="search-user"
            type="search"
            placeholder="جستجوی آیدی..."
          >

          <button id="search-btn" type="button">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>

        <div id="search-results"></div>

        <!-- پیام‌های ذخیره‌شده -->
        <button
          id="saved-messages-btn"
          class="saved-messages-btn"
          type="button"
        >
          <div class="saved-icon">
            <i class="fa-solid fa-bookmark"></i>
          </div>

          <div>
            <strong>پیام‌های ذخیره‌شده</strong>
            <small>فضای خصوصی من</small>
          </div>
        </button>

        <div id="conversation-list"></div>

      </aside>

      <!-- پنجره چت -->
      <main class="chat-panel">

        <header id="chat-header">
          <div class="empty-chat-header">
            <i class="fa-solid fa-comments"></i>
            <span>بهی مسنجر</span>
          </div>
        </header>

        <!-- پیام‌ها -->
        <div id="messages">
          <div class="welcome-chat">
            <div class="welcome-logo">B</div>
            <h2>به بهی مسنجر خوش آمدید</h2>
            <p>یک گفتگو را انتخاب کنید یا آیدی دوستتان را جستجو کنید.</p>
          </div>
        </div>

        <!-- ارسال پیام -->
        <form id="message-form">

          <button
            id="attach-btn"
            type="button"
            title="پیوست"
          >
            <i class="fa-solid fa-paperclip"></i>
          </button>

          <input
            id="message-input"
            type="text"
            placeholder="پیام خود را بنویسید..."
            autocomplete="off"
            disabled
          >

          <button type="submit" title="ارسال">
            <i class="fa-solid fa-paper-plane"></i>
          </button>

        </form>

      </main>

    </div>

    <!-- تنها منوی اصلی موبایل -->
    <nav class="mobile-nav">

      <button data-mobile-tab="chats" class="active" type="button">
        <i class="fa-solid fa-comments"></i>
        <span>چت‌ها</span>
      </button>

      <button data-mobile-tab="contacts" type="button">
        <i class="fa-solid fa-users"></i>
        <span>مخاطبین</span>
      </button>

      <button data-mobile-tab="profile" type="button">
        <i class="fa-solid fa-user"></i>
        <span>پروفایل</span>
      </button>

    </nav>

  </section>

  <script src="./main.js"></script>

</body>
</html>
