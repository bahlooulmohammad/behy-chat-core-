<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Behy Messenger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="auth-section">
  <div class="auth-card">
    <h1>بهی 💬</h1>
    <p>پیام‌رسان بهی</p>

    <div class="auth-tabs">
      <button id="login-tab">ورود</button>
      <button id="signup-tab">ثبت‌نام</button>
    </div>

    <form id="auth-form">
      <input id="username" placeholder="نام کاربری" required>
      <input id="password" type="password" placeholder="رمز عبور" required>
      <button type="submit" id="auth-submit">ورود به حساب</button>
    </form>
  </div>
</section>

<section id="chat-section" style="display:none">
  <header class="topbar">
    <h2>بهی</h2>
    <button id="saved-messages-btn">پیام‌های ذخیره‌شده</button>
  </header>

  <div id="chat-layout" class="chat-layout">

    <aside id="sidebar">
      <div class="sidebar-header">
        <h3 id="list-heading">چت‌ها</h3>
        <button id="new-chat-btn">＋</button>
      </div>

      <div class="search-box" id="search-box">
        <input id="search-user" placeholder="جستجوی شناسه">
        <button id="search-btn">🔍</button>
      </div>

      <div id="search-results"></div>
      <div id="conversation-list"></div>
    </aside>

    <main id="chat-panel">
      <div id="chat-header"></div>
      <div id="messages"></div>

      <form id="message-form">
        <button type="button" id="attach-btn">＋</button>
        <input id="message-input" placeholder="پیام بنویس..." autocomplete="off">
        <button type="submit">➤</button>
      </form>
    </main>

  </div>

  <nav class="mobile-nav">
    <button data-mobile-tab="chats">💬<span>چت‌ها</span></button>
    <button data-mobile-tab="contacts">👥<span>مخاطبین</span></button>
    <button data-mobile-tab="profile">👤<span>پروفایل</span></button>
  </nav>
</section>

<script src="config.js"></script>
<script src="main.js"></script>

</body>
</html>
