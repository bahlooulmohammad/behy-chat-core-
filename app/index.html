
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="پیام‌رسان بهی">
  <title>Behy Messenger</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
<div class="app">

  <header class="header">
    <div class="brand">
      <div class="logo">B</div>
      <div>
        <h1>Behy Messenger</h1>
        <p>پیام‌رسان بهی</p>
      </div>
    </div>
  </header>

  <main id="main">

    <section id="auth-section" class="auth-section">
      <div class="auth-card">
        <div class="auth-logo">B</div>
        <h2>خوش آمدی 👋</h2>
        <p>برای ورود به پیام‌رسان بهی اطلاعاتت را وارد کن.</p>

        <div class="auth-tabs">
          <button id="login-tab" type="button" class="primary">ورود</button>
          <button id="signup-tab" type="button">ثبت نام</button>
        </div>

        <form id="auth-form">
          <label for="username">نام کاربری</label>
          <div class="input-wrap">
            <i class="fa-regular fa-user"></i>
            <input id="username" name="username" type="text"
              placeholder="نام کاربری خود را وارد کنید"
              autocomplete="username" required>
          </div>

          <label for="password">رمز عبور</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input id="password" name="password" type="password"
              placeholder="رمز عبور" autocomplete="current-password" required>
          </div>

          <button id="auth-submit" class="primary auth-submit" type="submit">
            ورود به حساب
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <p id="auth-message" class="message" role="status"></p>
        </form>
      </div>
    </section>

    <section id="chat-section" hidden>

      <div class="user-bar">
        <div class="user-info">
          <div class="avatar">B</div>
          <div>
            <span>حساب کاربری</span>
            <strong id="current-user"></strong>
          </div>
        </div>
        <button id="logout-btn" type="button" class="logout-button">
          <i class="fa-solid fa-right-from-bracket"></i>
          خروج
        </button>
      </div>

      <div class="chat-layout">

        <aside class="sidebar">

          <div class="sidebar-title">
            <h2>پیام‌ها</h2>
            <button id="new-chat-btn" type="button" class="round-button" aria-label="پیام جدید">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
          </div>

          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="search-user" type="text" placeholder="جستجوی نام کاربری...">
            <button id="search-btn" type="button">جستجو</button>
          </div>

          <div class="menu-tabs">
            <button id="chats-tab" type="button" class="active">
              <i class="fa-solid fa-comments"></i>
              چت‌ها
            </button>
            <button id="contacts-tab" type="button">
              <i class="fa-solid fa-address-book"></i>
              مخاطبین
            </button>
            <button id="profile-tab" type="button">
              <i class="fa-solid fa-user"></i>
              پروفایل
            </button>
          </div>

          <button id="saved-messages-btn" type="button" class="conversation-item">
            <i class="fa-solid fa-bookmark"></i>
            پیام‌های ذخیره‌شده
            <small>فضای خصوصی من</small>
          </button>

          <div id="search-results"></div>

          <div class="section-heading">
            <h3 id="list-heading">گفتگوهای من</h3>
            <span>همه پیام‌ها</span>
          </div>

          <div id="conversation-list"></div>

          <div class="sidebar-footer">
            <button id="settings-btn" type="button">
              <i class="fa-solid fa-gear"></i>
              تنظیمات
            </button>
            <button id="about-btn" type="button">
              <i class="fa-solid fa-circle-info"></i>
              درباره بهی
            </button>
          </div>

        </aside>

        <section class="chat-window">

          <div id="chat-header" class="chat-header">
            <button id="mobile-back-btn" class="mobile-back-btn" type="button" aria-label="بازگشت">
              <i class="fa-solid fa-arrow-right"></i>
            </button>
            <div class="empty-avatar">
              <i class="fa-solid fa-comments"></i>
            </div>
            <div>
              <strong>بهی مسنجر</strong>
              <p>یک گفتگو را انتخاب کنید</p>
            </div>
            <div class="chat-actions">
              <button id="chat-info-btn" type="button" aria-label="اطلاعات">
                <i class="fa-solid fa-ellipsis-vertical"></i>
              </button>
            </div>
          </div>

          <div id="messages" class="messages">
            <div class="welcome-chat">
              <div class="welcome-logo">B</div>
              <h2>به بهی خوش آمدی</h2>
              <p>برای شروع یک گفتگو، کاربر موردنظرت را جستجو کن.</p>
            </div>
          </div>

          <form id="message-form" class="message-form">
            <button type="button" id="attach-btn" class="attach-button" aria-label="پیوست">
              <i class="fa-solid fa-paperclip"></i>
            </button>
            <input id="message-input" type="text"
              placeholder="پیام خود را بنویسید..."
              autocomplete="off" required>
            <button type="submit" class="send-button" aria-label="ارسال">
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </form>

        </section>
      </div>

      <nav class="mobile-nav" aria-label="منوی اصلی">
        <button type="button" class="active" data-mobile-tab="chats">
          <i class="fa-solid fa-comments"></i>
          <span>چت‌ها</span>
        </button>
        <button type="button" data-mobile-tab="contacts">
          <i class="fa-solid fa-address-book"></i>
          <span>مخاطبین</span>
        </button>
        <button type="button" data-mobile-tab="saved">
          <i class="fa-solid fa-bookmark"></i>
          <span>ذخیره‌شده</span>
        </button>
        <button type="button" data-mobile-tab="profile">
          <i class="fa-solid fa-user"></i>
          <span>پروفایل</span>
        </button>
        <button type="button" data-mobile-tab="settings">
          <i class="fa-solid fa-gear"></i>
          <span>تنظیمات</span>
        </button>
      </nav>

    </section>
  </main>

  <footer>
    <p>Behy Messenger © 2026</p>
    <p>ارتباطی ساده، سریع و امن</p>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="main.js"></script>
</body>
</html>
