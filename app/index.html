<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Behy Messenger</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <div class="logo">B</div>
      <div>
        <h1>بهی مسنجر</h1>
        <p>پیام‌رسان بهی</p>
      </div>
    </div>

    <button
      id="new-chat-btn"
      class="header-icon"
      type="button"
      aria-label="جستجوی کاربران"
      title="جستجو">
      <i class="fa-solid fa-magnifying-glass"></i>
    </button>
  </header>

  <!-- AUTH -->
  <main id="main">

    <section id="auth-section" class="auth-section">

      <div class="auth-card">

        <div class="auth-logo">B</div>

        <h2>به بهی خوش آمدید</h2>
        <p>با دوستان خود گفتگو کنید</p>

        <div class="auth-tabs">
          <button id="login-tab" class="primary" type="button">
            ورود
          </button>

          <button id="signup-tab" type="button">
            ثبت‌نام
          </button>
        </div>

        <form id="auth-form">

          <label for="username">نام کاربری</label>

          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input
              id="username"
              type="text"
              placeholder="نام کاربری"
              autocomplete="username"
              required
              minlength="3"
              maxlength="24">
          </div>

          <label for="password">رمز عبور</label>

          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input
              id="password"
              type="password"
              placeholder="رمز عبور"
              autocomplete="current-password"
              required
              minlength="8">
          </div>

          <button id="auth-submit" class="primary" type="submit">
            ورود به حساب
          </button>

          <p id="auth-message"></p>

        </form>
      </div>

    </section>

    <!-- APP -->
    <section id="chat-section" hidden>

      <!-- CHAT LAYOUT -->
      <div id="chat-layout" class="chat-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">

          <!-- Sidebar title -->
          <div class="sidebar-title">
            <h2 id="list-heading">گفتگوها</h2>

            <button
              id="saved-messages-btn"
              class="round-button"
              type="button"
              title="پیام‌های ذخیره‌شده">
              <i class="fa-solid fa-bookmark"></i>
            </button>
          </div>

          <!-- Search -->
          <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
              id="search-user"
              type="search"
              placeholder="جستجو با آیدی..."
              autocomplete="off">

            <button
              id="search-btn"
              type="button"
              aria-label="جستجو">
              <i class="fa-solid fa-arrow-left"></i>
            </button>

          </div>

          <!-- Search results -->
          <div id="search-results"></div>

          <!-- Main tabs -->
          <div class="menu-tabs">

            <button id="chats-tab" class="active" type="button">
              <i class="fa-solid fa-message"></i>
              چت‌ها
            </button>

            <button id="contacts-tab" type="button">
              <i class="fa-solid fa-users"></i>
              مخاطبین
            </button>

            <button id="profile-tab" type="button">
              <i class="fa-solid fa-user"></i>
              پروفایل
            </button>

          </div>

          <!-- Conversations -->
          <div class="section-heading">
            <h3>همه گفتگوها</h3>
          </div>

          <div id="conversation-list"></div>

          <!-- Sidebar footer -->
          <div class="sidebar-footer">
            <button id="about-btn" type="button">
              <i class="fa-solid fa-circle-info"></i>
              درباره بهی
            </button>
          </div>

        </aside>

        <!-- CHAT WINDOW -->
        <section class="chat-window">

          <!-- Chat header -->
          <header id="chat-header" class="chat-header">

            <div class="empty-avatar">
              <i class="fa-solid fa-comments"></i>
            </div>

            <div>
              <strong>بهی مسنجر</strong>
              <p>یک گفتگو انتخاب کنید</p>
            </div>

          </header>

          <!-- Messages -->
          <div id="messages" class="messages">

            <div class="welcome-chat">

              <div class="welcome-logo">B</div>

              <h2>به بهی خوش آمدید</h2>

              <p>
                از فهرست گفتگوها یک نفر را انتخاب کنید
                یا با آیدی اختصاصی جستجو کنید.
              </p>

            </div>

          </div>

          <!-- Message form -->
          <form id="message-form" class="message-form">

            <button
              id="attach-btn"
              class="attach-button"
              type="button"
              aria-label="پیوست">
              <i class="fa-solid fa-paperclip"></i>
            </button>

            <input
              id="message-input"
              type="text"
              placeholder="پیام خود را بنویسید..."
              autocomplete="off"
              disabled>

            <button
              class="send-button"
              type="submit"
              aria-label="ارسال پیام">
              <i class="fa-solid fa-paper-plane"></i>
            </button>

          </form>

        </section>

      </div>

      <!-- MOBILE BOTTOM NAV -->
      <nav class="mobile-nav">

        <button
          type="button"
          data-mobile-tab="chats"
          class="active">

          <i class="fa-solid fa-message"></i>
          <span>چت‌ها</span>
        </button>

        <button
          type="button"
          data-mobile-tab="contacts">

          <i class="fa-solid fa-users"></i>
          <span>مخاطبین</span>
        </button>

        <button
          type="button"
          data-mobile-tab="profile">

          <i class="fa-solid fa-user"></i>
          <span>پروفایل</span>
        </button>

      </nav>

    </section>

  </main>

  <footer>
    <p>Behy Messenger</p>
  </footer>

</div>

<!-- CONFIG -->
<script src="./config.js"></script>

<!-- APP SCRIPT -->
<script src="./main.js"></script>

</body>
</html>
