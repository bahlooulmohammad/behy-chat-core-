
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>بهی مسنجر</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <style>
    [hidden] {
      display: none !important;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #chat-section {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    #chat-layout {
      width: 100%;
      height: 100%;
      min-width: 0;
      overflow: hidden;
    }

    #chat-layout > .sidebar,
    #chat-layout > .chat-panel {
      min-width: 0;
    }

    .mobile-nav {
      display: none;
    }

    @media (max-width: 700px) {
      #chat-section {
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }

      #chat-layout {
        display: block;
        flex: 1;
        position: relative;
        min-height: 0;
      }

      #chat-layout > .sidebar {
        display: flex;
        width: 100%;
        max-width: 100%;
        height: 100%;
      }

      #chat-layout > .chat-panel {
        display: none;
      }

      #chat-layout.chat-open > .sidebar {
        display: none;
      }

      #chat-layout.chat-open > .chat-panel {
        display: flex;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        flex-direction: column;
        z-index: 2;
      }

      .mobile-nav {
        display: flex;
        width: 100%;
        flex-shrink: 0;
        height: 64px;
        padding-bottom: env(safe-area-inset-bottom);
        box-sizing: content-box;
      }
    }
  </style>
</head>

<body>

  <!-- ورود و ثبت نام -->
  <section id="auth-section">
    <div class="auth-card">
      <div class="welcome-logo">B</div>
      <h1>بهی مسنجر</h1>
      <p>پیام‌رسان ساده، سریع و امن</p>

      <div class="auth-tabs">
        <button id="login-tab" type="button">ورود</button>
        <button id="signup-tab" type="button">ساخت حساب</button>
      </div>

      <form id="auth-form">
        <label for="username">نام کاربری</label>
        <input
          id="username"
          type="text"
          placeholder="نام کاربری"
          autocomplete="username"
          required
        >

        <label for="password">رمز عبور</label>
        <input
          id="password"
          type="password"
          placeholder="رمز عبور"
          autocomplete="current-password"
          required
        >

        <button id="auth-submit" class="primary" type="submit">
          ورود به حساب
        </button>

        <div id="auth-message"></div>
      </form>
    </div>
  </section>

  <!-- محیط اصلی برنامه -->
  <section id="chat-section" hidden>

    <span id="current-user" hidden></span>

    <!-- تنها ساختار اصلی برنامه -->
    <div id="chat-layout" class="chat-layout">

      <!-- صفحه فهرست -->
      <aside class="sidebar">

        <header class="sidebar-header">
          <h2 id="list-heading">گفتگوها</h2>

          <button
            id="new-chat-btn"
            class="round-button"
            type="button"
            title="جستجوی آیدی"
            aria-label="جستجوی کاربران"
          >
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </header>

        <!-- جستجوی آیدی -->
        <div class="search-box" style="display:none">
          <input
            id="search-user"
            type="search"
            placeholder="جستجوی آیدی..."
            autocomplete="off"
          >

          <button id="search-btn" type="button" aria-label="جستجو">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>

        <div id="search-results"></div>

        <!-- پیام‌های ذخیره شده -->
        <button
          id="saved-messages-btn"
          class="saved-messages-btn"
          type="button"
        >
          <div class="saved-icon">
            <i class="fa-solid fa-bookmark"></i>
          </div>

          <div>
            <strong>پیام‌های ذخیره‌شده</strong>
            <small>فضای خصوصی من</small>
          </div>
        </button>

        <!-- محتوای چت‌ها، مخاطبین و پروفایل -->
        <div id="conversation-list"></div>

      </aside>

      <!-- صفحه گفتگو؛ فقط هنگام باز شدن چت نمایش داده می‌شود -->
      <main class="chat-panel">

        <header id="chat-header">
          <div class="empty-chat-header">
            <i class="fa-solid fa-comments"></i>
            <span>بهی مسنجر</span>
          </div>
        </header>

        <div id="messages">
          <div class="welcome-chat">
            <div class="welcome-logo">B</div>
            <h2>به بهی مسنجر خوش آمدید</h2>
            <p>یک گفتگو را انتخاب کنید یا آیدی دوستتان را جستجو کنید.</p>
          </div>
        </div>

        <form id="message-form">

          <button
            id="attach-btn"
            type="button"
            title="پیوست"
            aria-label="پیوست"
          >
            <i class="fa-solid fa-paperclip"></i>
          </button>

          <input
            id="message-input"
            type="text"
            placeholder="پیام خود را بنویسید..."
            autocomplete="off"
            disabled
          >

          <button type="submit" title="ارسال" aria-label="ارسال پیام">
            <i class="fa-solid fa-paper-plane"></i>
          </button>

        </form>

      </main>

    </div>

    <!-- منوی واحد پایین گوشی -->
    <nav class="mobile-nav">

      <button data-mobile-tab="chats" class="active" type="button">
        <i class="fa-solid fa-comments"></i>
        <span>چت‌ها</span>
      </button>

      <button data-mobile-tab="contacts" type="button">
        <i class="fa-solid fa-users"></i>
        <span>مخاطبین</span>
      </button>

      <button data-mobile-tab="profile" type="button">
        <i class="fa-solid fa-user"></i>
        <span>پروفایل</span>
      </button>

    </nav>

  </section>

  <script src="./main.js"></script>

</body>
</html>
